apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: nginx-ingress
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB_USERS
        volumeMounts:
        - name: initdb  # For initialization scripts 
          mountPath: /docker-entrypoint-initdb.d/
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: initdb   
        hostPath:
          path: /vagrant/services/database
      - name: postgres-storage  # This volume is sourced from the PVC
        persistentVolumeClaim:
          claimName: postgres-pvc  # Must match the name in pvc.yaml

 
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: nginx-ingress
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# RabbitMQ Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: nginx-ingress
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: nginx-ingress
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
# Session Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-deployment
  namespace: nginx-ingress
  labels:
    env: prod
    app: session
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session
  template:
    metadata:
      labels:
        app: session
        env: prod
    spec:
      initContainers:
      # this init container will run first and wait for postgres
      - name: wait-for-postgres
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "waiting for postgres..."; sleep 3; done;']
      containers:
      - name: session
        image: maelysje/session-service:v2
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB_USERS
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: nginx-ingress
spec:
  selector:
    app: session
  ports:
  - port: 8081
    targetPort: 8081
